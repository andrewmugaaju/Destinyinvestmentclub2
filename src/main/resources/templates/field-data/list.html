<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Field Data Report')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div th:replace="~{fragments/report-header :: header(title='Field Data Report', subtitle=${fromDate} + ' to ' + ${toDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/field-data}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" target="_blank"
               th:href="@{/field-data/pdf(fromDate=${fromDate},toDate=${toDate})}">
                <i class="bi bi-file-earmark-pdf"></i> Export to PDF
            </a>
            <a class="btn btn-primary" href="/field-data/new"><i class="bi bi-plus-circle"></i> Add Collection</a>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Total Collected</div>
                <div class="fs-5" th:text="${#numbers.formatDecimal(totalAmount,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <table class="table table-hover table-report">
            <thead><tr><th>Date</th><th>Member</th><th>Savings Product</th><th class="money">Amount</th><th>Field Officer 1</th><th>Field Officer 2</th><th>Posted By</th><th>Journal</th><th></th></tr></thead>
            <tbody>
            <tr th:each="f : ${entries}" th:classappend="${f.savingsTransaction.voided} ? 'text-muted' : ''">
                <td th:text="${f.savingsTransaction.transactionDate}">-</td>
                <td th:text="${f.client.fullName}">-</td>
                <td th:text="${f.savingsTransaction.savingsAccount.savingsProduct.name}">-</td>
                <td class="money">
                    <span th:text="${#numbers.formatDecimal(f.savingsTransaction.amount,1,'COMMA',2,'POINT')}">0.00</span>
                    <span th:if="${f.savingsTransaction.voided}" class="badge bg-danger ms-1">VOIDED</span>
                </td>
                <td th:text="${f.collectorOneName}">-</td>
                <td th:text="${f.collectorTwoName}">-</td>
                <td th:text="${f.createdBy}">-</td>
                <td>
                    <a th:if="${f.savingsTransaction.journalEntryId != null}" class="btn btn-sm btn-outline-secondary"
                       th:href="@{/journal/{id}(id=${f.savingsTransaction.journalEntryId})}" th:text="'#' + ${f.savingsTransaction.journalEntryId}">#1</a>
                </td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/field-data/{id}(id=${f.id})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}"><td colspan="9" class="text-muted">No field collections in this period.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
