<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Savings Product')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2 th:text="${product.id} != null ? 'Edit Savings Product' : 'New Savings Product'">New Product</h2>
    <div class="card p-4">
        <form th:action="@{/savings-products}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Code</label>
                <input class="form-control" th:field="*{code}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" th:field="*{name}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" step="0.001" class="form-control" th:field="*{annualInterestRate}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Minimum Opening Balance</label>
                <input type="number" step="0.01" class="form-control" th:field="*{minOpeningBalance}" required/>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" th:field="*{active}"/>
                <label class="form-check-label">Active</label>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/savings-products" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
