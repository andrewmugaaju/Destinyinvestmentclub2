<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Savings Products')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Savings Products</h2>
        <a class="btn btn-primary" href="/savings-products/new">+ New Product</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover">
            <thead><tr><th>Code</th><th>Name</th><th>Annual Interest %</th><th>Min Opening Balance</th><th>Active</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.code}">SP01</td>
                <td th:text="${p.name}">Regular Savings</td>
                <td th:text="${p.annualInterestRate}">5.000</td>
                <td th:text="${#numbers.formatDecimal(p.minOpeningBalance,1,'COMMA',2,'POINT')}">0.00</td>
                <td th:text="${p.active}">true</td>
                <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/savings-products/{id}/edit(id=${p.id})}">Edit</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="text-muted">No savings products yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
