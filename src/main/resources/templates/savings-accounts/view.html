<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Savings Account')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between">
        <h2 th:text="${account.accountNumber}">SB000001</h2>
        <div class="fs-4" th:text="${#numbers.formatDecimal(account.balance,1,'COMMA',2,'POINT')}">0.00</div>
    </div>
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-3"><strong>Owner</strong><br/><span th:text="${account.ownerName}">-</span></div>
            <div class="col-md-3"><strong>Product</strong><br/><span th:text="${account.savingsProduct.name}">-</span></div>
            <div class="col-md-3"><strong>Opened</strong><br/><span th:text="${account.openedDate}">-</span></div>
            <div class="col-md-3"><strong>Status</strong><br/><span th:text="${account.status}">-</span></div>
        </div>
    </div>

    <div class="card p-3 mb-3">
        <h5>Record a Withdrawal</h5>
        <form th:action="@{/savings-accounts/{id}/withdraw(id=${account.id})}" method="post" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" name="amount" class="form-control" required/>
            </div>
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" name="transactionDate" class="form-control" th:value="${T(java.time.LocalDate).now()}"/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Narration</label>
                <input type="text" name="narration" class="form-control"/>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-danger w-100">Withdraw</button>
            </div>
        </form>
    </div>

    <div class="card p-3">
        <h5>Transaction History</h5>
        <table class="table table-sm">
            <thead><tr><th>Date</th><th>Type</th><th class="money">Amount</th><th class="money">Balance</th><th>Narration</th></tr></thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.transactionDate}">-</td>
                <td th:text="${t.transactionType}">-</td>
                <td class="money" th:text="${#numbers.formatDecimal(t.amount,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(t.runningBalance,1,'COMMA',2,'POINT')}">0.00</td>
                <td th:text="${t.narration}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="5" class="text-muted">No transactions yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
