<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Open Savings Account')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2>Open Savings Account</h2>
    <div class="card p-4">
        <form th:action="@{/savings-accounts}" method="post">
            <div class="mb-3">
                <label class="form-label">Client (individual account)</label>
                <select class="form-select" name="clientId">
                    <option value="">-- none --</option>
                    <option th:each="c : ${clients}" th:value="${c.id}" th:selected="${selectedClientId != null and selectedClientId == c.id}" th:text="${c.fullName} + ' (' + ${c.clientNumber} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Or Group (group account)</label>
                <select class="form-select" name="groupId">
                    <option value="">-- none --</option>
                    <option th:each="g : ${groups}" th:value="${g.id}" th:selected="${selectedGroupId != null and selectedGroupId == g.id}" th:text="${g.groupName}"></option>
                </select>
                <div class="form-text">Choose either a client or a group, not both.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Savings Product</label>
                <select class="form-select" name="productId" required>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name} + ' (' + ${p.annualInterestRate} + '% p.a.)'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Opened Date</label>
                <input type="date" class="form-control" name="openedDate" th:value="${T(java.time.LocalDate).now()}"/>
            </div>
            <button type="submit" class="btn btn-primary">Open Account</button>
            <a href="/savings-accounts" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
