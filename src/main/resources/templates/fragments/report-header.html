<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <h2 class="report-heading-title" th:text="${title}">Report</h2>
    <div class="report-heading-subtitle" th:if="${subtitle}" th:text="${subtitle}">-</div>
</div>
</body>
</html>
