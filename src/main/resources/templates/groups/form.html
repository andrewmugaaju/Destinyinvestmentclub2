<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Group')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2 th:text="${group.id} != null ? 'Edit Group' : 'New Group'">New Group</h2>
    <div class="card p-4">
        <form th:action="@{/groups}" th:object="${group}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Group Name</label>
                <input class="form-control" th:field="*{groupName}" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Meeting Day</label>
                <input class="form-control" th:field="*{meetingDay}" placeholder="e.g. Every Friday"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Formed Date</label>
                <input type="date" class="form-control" th:field="*{formedDate}"/>
            </div>
            <div class="mb-3" th:if="${group.id} != null">
                <label class="form-label">Status</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="s : ${T(com.destiny.club.domain.client.GroupStatus).values()}"
                            th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/groups" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
