<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Deposit Report')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div th:replace="~{fragments/report-header :: header(title='Deposit Report', subtitle=${fromDate} + ' to ' + ${toDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/deposits}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" target="_blank"
               th:href="@{/deposits/pdf(fromDate=${fromDate},toDate=${toDate})}">
                <i class="bi bi-file-earmark-pdf"></i> Export to PDF
            </a>
            <a class="btn btn-primary" href="/deposits/new"><i class="bi bi-plus-circle"></i> Add a Deposit</a>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Total Deposited</div>
                <div class="fs-5" th:text="${#numbers.formatDecimal(totalAmount,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <table class="table table-hover table-report">
            <thead><tr><th>Reference</th><th>Date</th><th>Member / Group</th><th>Savings Product</th><th class="money">Total</th><th>Posted By</th><th>Journal</th><th></th></tr></thead>
            <tbody>
            <tr th:each="d : ${deposits}" th:classappend="${d.voided} ? 'text-muted' : ''">
                <td>
                    <span th:text="${d.reference}">DEP-...</span>
                    <span th:if="${d.voided}" class="badge bg-danger ms-1">VOIDED</span>
                </td>
                <td th:text="${d.transactionDate}">-</td>
                <td th:text="${d.client != null ? d.client.fullName : (d.group != null ? d.group.groupName : '-')}">-</td>
                <td th:text="${savingsProductByDepositId.get(d.id)} ?: '-'">-</td>
                <td class="money" th:text="${#numbers.formatDecimal(d.totalAmount,1,'COMMA',2,'POINT')}">0.00</td>
                <td th:text="${d.createdBy}">-</td>
                <td>
                    <a th:if="${d.journalEntryId != null}" class="btn btn-sm btn-outline-secondary" th:href="@{/journal/{id}(id=${d.journalEntryId})}" th:text="'#' + ${d.journalEntryId}">#1</a>
                    <span th:if="${d.journalEntryId == null}">-</span>
                </td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/deposits/{id}(id=${d.id})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(deposits)}"><td colspan="8" class="text-muted">No deposits in this period.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
