<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='New User')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2>New User</h2>
    <div class="card p-4">
        <form th:action="@{/users}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input class="form-control" name="fullName" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Roles</label>
                <div class="form-check" th:each="r : ${roleOptions}">
                    <input class="form-check-input" type="checkbox" name="roles" th:value="${r}" th:id="${'role-' + r}"/>
                    <label class="form-check-label" th:for="${'role-' + r}" th:text="${r}">ROLE</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Create User</button>
            <a href="/users" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
