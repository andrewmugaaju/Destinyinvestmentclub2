<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Users')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Users</h2>
        <a class="btn btn-primary" href="/users/new">+ New User</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover">
            <thead><tr><th>Username</th><th>Full Name</th><th>Email</th><th>Roles</th><th>Enabled</th><th></th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}">jdoe</td>
                <td th:text="${u.fullName}">Jane Doe</td>
                <td th:text="${u.email}">-</td>
                <td>
                    <span class="badge bg-secondary me-1" th:each="r : ${u.roles}" th:text="${r.name}">ROLE</span>
                </td>
                <td th:text="${u.enabled} ? 'Yes' : 'No'">Yes</td>
                <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/users/{id}/edit(id=${u.id})}">Edit</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
