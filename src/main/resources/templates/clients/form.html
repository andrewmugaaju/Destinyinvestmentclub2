<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Client')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 720px;">
    <h2 th:text="${client.id} != null ? 'Edit Client' : 'New Client'">New Client</h2>
    <div class="card p-4">
        <form th:action="@{/clients}" th:object="${client}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input class="form-control" th:field="*{firstName}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input class="form-control" th:field="*{lastName}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input class="form-control" th:field="*{phone}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" th:field="*{email}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ID Number</label>
                    <input class="form-control" th:field="*{idNumber}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Group (optional)</label>
                    <select class="form-select" name="groupId">
                        <option value="">-- Individual member --</option>
                        <option th:each="g : ${groups}" th:value="${g.id}"
                                th:selected="${client.group != null and client.group.id == g.id}"
                                th:text="${g.groupName}">Group</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" th:field="*{address}"></textarea>
                </div>
                <div class="col-md-6" th:if="${client.id} != null">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${T(com.destiny.club.domain.client.ClientStatus).values()}"
                                th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/clients" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
