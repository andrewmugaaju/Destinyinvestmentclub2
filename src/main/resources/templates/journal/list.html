<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Journal Entries')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Journal Entries</h2>
        <a class="btn btn-primary" href="/journal/new">+ New Manual Entry</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover">
            <thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Source</th></tr></thead>
            <tbody>
            <tr th:each="e : ${entries}">
                <td th:text="${e.transactionDate}">-</td>
                <td><a th:href="@{/journal/{id}(id=${e.id})}" th:text="${e.reference}">-</a></td>
                <td th:text="${e.description}">-</td>
                <td th:text="${e.sourceType}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}"><td colspan="4" class="text-muted">No journal entries yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
