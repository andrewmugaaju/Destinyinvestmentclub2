<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Journal Entries')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Journal Entries</h2>
        <div class="d-flex align-items-end gap-2 flex-wrap">
            <form onsubmit="return goToJournalId()" class="d-flex align-items-end gap-2">
                <div>
                    <label class="form-label mb-0 small">Find by Journal ID</label>
                    <input type="number" min="1" class="form-control" id="journalIdInput" placeholder="e.g. 42" required/>
                </div>
                <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> View</button>
            </form>
            <a class="btn btn-primary" href="/journal/new">+ New Manual Entry</a>
        </div>
    </div>
    <div class="card p-3">
        <table class="table table-hover">
            <thead><tr><th>ID</th><th>Date</th><th>Reference</th><th>Description</th><th>Source</th><th></th></tr></thead>
            <tbody>
            <tr th:each="e : ${entries}">
                <td th:text="${e.id}">-</td>
                <td th:text="${e.transactionDate}">-</td>
                <td th:text="${e.reference}">-</td>
                <td th:text="${e.description}">-</td>
                <td th:text="${e.sourceType}">-</td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/journal/{id}(id=${e.id})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}"><td colspan="6" class="text-muted">No journal entries yet.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function goToJournalId() {
            var id = document.getElementById('journalIdInput').value;
            if (id) {
                window.location.href = '/journal/' + encodeURIComponent(id);
            }
            return false;
        }
    </script>
</main>
</body>
</html>
