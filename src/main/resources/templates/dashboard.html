<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Dashboard')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card p-3">
                <div class="text-muted small">Total Clients</div>
                <div class="fs-3" th:text="${totalClients}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3">
                <div class="text-muted small">Total Groups</div>
                <div class="fs-3" th:text="${totalGroups}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3">
                <div class="text-muted small">Total Member Savings</div>
                <div class="fs-4" th:text="${#numbers.formatDecimal(totalSavings,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3">
                <div class="text-muted small">Outstanding Loans</div>
                <div class="fs-4" th:text="${#numbers.formatDecimal(totalOutstandingLoans,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Cash / Bank Balance</div>
                <div class="fs-4" th:text="${#numbers.formatDecimal(cashBalance,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Pending Loan Applications</div>
                <div class="fs-4" th:text="${pendingLoans}">0</div>
                <a href="/loan-accounts" class="small">Review applications &rarr;</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Quick Actions</div>
                <a href="/deposits/new" class="btn btn-primary btn-sm mt-2">Record a Deposit</a>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <h5>Recent Journal Entries</h5>
        <div class="table-responsive">
            <table class="table table-sm table-report">
                <thead>
                <tr><th>Date</th><th>Reference</th><th>Description</th><th>Source</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${recentEntries}">
                    <td th:text="${e.transactionDate}">-</td>
                    <td th:text="${e.reference}">-</td>
                    <td th:text="${e.description}">-</td>
                    <td th:text="${e.sourceType}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentEntries)}"><td colspan="4" class="text-muted">No transactions posted yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
