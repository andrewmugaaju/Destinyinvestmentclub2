<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Edit GL Account')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2 th:text="${account.code} + ' - ' + ${account.name}">Edit GL Account</h2>
    <div class="card p-4">
        <form th:action="@{/gl-accounts/{id}(id=${account.id})}" method="post">
            <div class="row g-3 mb-3">
                <div class="col-md-4"><strong>Code</strong><br/><span th:text="${account.code}">-</span></div>
                <div class="col-md-4"><strong>Type</strong><br/><span th:text="${account.accountType}">-</span></div>
                <div class="col-md-4"><strong>System Account</strong><br/><span th:text="${account.systemAccount} ? 'Yes' : 'No'">-</span></div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" name="cashAccount" th:checked="${account.cashAccount}"/>
                <label class="form-check-label">Payment channel (tellers can select this as the receiving/paying account when recording deposits, withdrawals, disbursements and repayments)</label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" name="active" th:checked="${account.active}"/>
                <label class="form-check-label">Active</label>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/gl-accounts" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
