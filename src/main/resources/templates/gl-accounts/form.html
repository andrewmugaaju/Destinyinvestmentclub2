<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='New GL Account')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2>New GL Account</h2>
    <div class="card p-4">
        <form th:action="@{/gl-accounts}" th:object="${account}" method="post">
            <div class="mb-3">
                <label class="form-label">Code</label>
                <input class="form-control" th:field="*{code}" required placeholder="e.g. 5200"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" th:field="*{name}" required placeholder="e.g. Rent Expense"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Account Type</label>
                <select class="form-select" th:field="*{accountType}">
                    <option th:each="t : ${T(com.destiny.club.domain.accounting.AccountType).values()}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" th:field="*{cashAccount}"/>
                <label class="form-check-label">Payment channel (tellers can select this as the receiving/paying account when recording deposits, withdrawals, disbursements and repayments)</label>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" th:field="*{description}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/gl-accounts" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
