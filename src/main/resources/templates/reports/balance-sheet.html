<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Balance Sheet')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Balance Sheet', subtitle='As of ' + ${asOfDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/balance-sheet}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">As of Date</label>
                <input type="date" class="form-control" name="asOfDate" th:value="${asOfDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank"
           th:href="@{/reports/balance-sheet/pdf(asOfDate=${asOfDate})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Assets</h5>
                <table class="table table-sm">
                    <tbody>
                    <tr th:each="a : ${report.assets}">
                        <td th:text="${a.code} + ' - ' + ${a.name}">-</td>
                        <td class="money" th:text="${#numbers.formatDecimal(a.amount,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold"><td>Total Assets</td><td class="money" th:text="${#numbers.formatDecimal(report.totalAssets,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    </tfoot>
                </table>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>Liabilities</h5>
                <table class="table table-sm">
                    <tbody>
                    <tr th:each="l : ${report.liabilities}">
                        <td th:text="${l.code} + ' - ' + ${l.name}">-</td>
                        <td class="money" th:text="${#numbers.formatDecimal(l.amount,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold"><td>Total Liabilities</td><td class="money" th:text="${#numbers.formatDecimal(report.totalLiabilities,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    </tfoot>
                </table>
            </div>
            <div class="card p-3">
                <h5>Equity</h5>
                <table class="table table-sm">
                    <tbody>
                    <tr th:each="e : ${report.equity}">
                        <td th:text="${e.code} + ' - ' + ${e.name}">-</td>
                        <td class="money" th:text="${#numbers.formatDecimal(e.amount,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    <tr>
                        <td>Net Surplus (accumulated)</td>
                        <td class="money" th:text="${#numbers.formatDecimal(report.netSurplus,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold"><td>Total Equity</td><td class="money" th:text="${#numbers.formatDecimal(report.totalEquityIncludingSurplus,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    <tr class="fw-bold"><td>Total Liabilities + Equity</td><td class="money" th:text="${#numbers.formatDecimal(report.totalLiabilitiesAndEquity,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3" th:class="${report.balanced} ? 'alert alert-success' : 'alert alert-danger'"
         th:text="${report.balanced} ? 'Balance sheet balances: Assets = Liabilities + Equity.' : 'Balance sheet does NOT balance - please investigate.'"></div>
</main>
</body>
</html>
