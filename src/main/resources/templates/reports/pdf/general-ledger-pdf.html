<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>General Ledger</title>
    <th:block th:replace="~{reports/pdf/fragments/pdf-style :: style}"></th:block>
</head>
<body>
    <div class="letterhead">
        <div class="brand-mark">DIC</div>
        <div class="club-name">Destiny Investment Club</div>
        <div class="report-title">General Ledger - <span th:text="${report.account.code} + ' - ' + ${report.account.name}">Account</span></div>
        <div class="meta">Period: <strong th:text="${fromDate}">2026-01-01</strong> to <strong th:text="${toDate}">2026-01-31</strong></div>
    </div>

    <table>
        <thead>
        <tr><th>Date</th><th>Reference</th><th>Description</th><th class="money">Debit</th><th class="money">Credit</th><th class="money">Balance</th></tr>
        </thead>
        <tbody>
        <tr class="opening-row">
            <td colspan="5">Opening Balance</td>
            <td class="money" th:text="${#numbers.formatDecimal(report.openingBalance,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        <tr th:each="r : ${report.rows}">
            <td th:text="${r.date}">-</td>
            <td th:text="${r.reference}">-</td>
            <td th:text="${r.description}">-</td>
            <td class="money" th:text="${r.debit.signum() != 0} ? ${#numbers.formatDecimal(r.debit,1,'COMMA',2,'POINT')} : ''"></td>
            <td class="money" th:text="${r.credit.signum() != 0} ? ${#numbers.formatDecimal(r.credit,1,'COMMA',2,'POINT')} : ''"></td>
            <td class="money" th:text="${#numbers.formatDecimal(r.runningBalance,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(report.rows)}"><td colspan="6">No movement in this period.</td></tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="5">Closing Balance</td>
            <td class="money" th:text="${#numbers.formatDecimal(report.closingBalance,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tfoot>
    </table>

    <div class="footer-note">
        Generated <span th:text="${generatedAt}">-</span> by <span th:text="${generatedBy}">-</span>
    </div>
</body>
</html>
