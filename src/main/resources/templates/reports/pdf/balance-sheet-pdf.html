<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Balance Sheet</title>
    <th:block th:replace="~{reports/pdf/fragments/pdf-style :: style}"></th:block>
</head>
<body>
    <div class="letterhead">
        <div class="brand-mark">DIC</div>
        <div class="club-name">Destiny Investment Club</div>
        <div class="report-title">Balance Sheet</div>
        <div class="meta">As of <strong th:text="${asOfDate}">2026-01-01</strong></div>
    </div>

    <div class="section-title">Assets</div>
    <table>
        <tbody>
        <tr th:each="a : ${report.assets}">
            <td th:text="${a.code} + ' - ' + ${a.name}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(a.amount,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr><td>Total Assets</td><td class="money" th:text="${#numbers.formatDecimal(report.totalAssets,1,'COMMA',2,'POINT')}">0.00</td></tr>
        </tfoot>
    </table>

    <div class="section-title">Liabilities</div>
    <table>
        <tbody>
        <tr th:each="l : ${report.liabilities}">
            <td th:text="${l.code} + ' - ' + ${l.name}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(l.amount,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr><td>Total Liabilities</td><td class="money" th:text="${#numbers.formatDecimal(report.totalLiabilities,1,'COMMA',2,'POINT')}">0.00</td></tr>
        </tfoot>
    </table>

    <div class="section-title">Equity</div>
    <table>
        <tbody>
        <tr th:each="e : ${report.equity}">
            <td th:text="${e.code} + ' - ' + ${e.name}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(e.amount,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        <tr>
            <td>Net Surplus (accumulated)</td>
            <td class="money" th:text="${#numbers.formatDecimal(report.netSurplus,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tbody>
        <tfoot>
        <tr><td>Total Equity</td><td class="money" th:text="${#numbers.formatDecimal(report.totalEquityIncludingSurplus,1,'COMMA',2,'POINT')}">0.00</td></tr>
        <tr><td>Total Liabilities + Equity</td><td class="money" th:text="${#numbers.formatDecimal(report.totalLiabilitiesAndEquity,1,'COMMA',2,'POINT')}">0.00</td></tr>
        </tfoot>
    </table>

    <div th:class="${report.balanced} ? 'status-ok' : 'status-bad'"
         th:text="${report.balanced} ? 'Balance sheet balances: Assets = Liabilities + Equity.' : 'Balance sheet does NOT balance - please investigate.'"></div>

    <div class="footer-note">
        Generated <span th:text="${generatedAt}">-</span> by <span th:text="${generatedBy}">-</span>
    </div>
</body>
</html>
