<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Loans Report</title>
    <th:block th:replace="~{reports/pdf/fragments/pdf-style :: style}"></th:block>
    <style>
        @page { size: A4 landscape; margin: 2cm 1.5cm 2.2cm 1.5cm; }
        table { font-size: 9.5px; }
    </style>
</head>
<body>
    <div class="letterhead">
        <div class="brand-mark">DIC</div>
        <div class="club-name">Destiny Investment Club</div>
        <div class="report-title">Loans Report</div>
        <div class="meta" th:text="${selectedStatus} != null ? ('Status: ' + ${selectedStatus}) : 'All loans'">All loans</div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Loan #</th><th>Borrower</th><th>Product</th><th class="money">Principal</th>
            <th class="money">Rate</th><th>Term</th><th>Status</th><th>Disbursed</th>
            <th class="money">Outst. Principal</th><th class="money">Outst. Interest</th><th class="money">Total Outst.</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${loans}">
            <td th:text="${l.loanAccountNumber}">LN000001</td>
            <td th:text="${l.borrowerName}">-</td>
            <td th:text="${l.loanProduct.name}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(l.principalAmount,1,'COMMA',2,'POINT')}">0.00</td>
            <td class="money" th:text="${l.annualInterestRate} + '%'">0%</td>
            <td th:text="${l.termMonths} + ' mo'">-</td>
            <td th:text="${l.status}">-</td>
            <td th:text="${l.disbursementDate}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(l.outstandingPrincipal,1,'COMMA',2,'POINT')}">0.00</td>
            <td class="money" th:text="${#numbers.formatDecimal(l.outstandingInterest,1,'COMMA',2,'POINT')}">0.00</td>
            <td class="money" th:text="${#numbers.formatDecimal(l.totalOutstanding,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(loans)}"><td colspan="11">No loans found.</td></tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="10">Total Outstanding</td>
            <td class="money" th:text="${#numbers.formatDecimal(totalOutstanding,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tfoot>
    </table>

    <div class="footer-note">
        Generated <span th:text="${generatedAt}">-</span> by <span th:text="${generatedBy}">-</span>
    </div>
</body>
</html>
