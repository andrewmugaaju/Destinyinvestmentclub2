<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Field Data Report</title>
    <th:block th:replace="~{reports/pdf/fragments/pdf-style :: style}"></th:block>
</head>
<body>
    <div class="letterhead">
        <div class="brand-mark">DIC</div>
        <div class="club-name">Destiny Investment Club</div>
        <div class="report-title">Field Data Report</div>
        <div class="meta">Period: <strong th:text="${fromDate}">2026-01-01</strong> to <strong th:text="${toDate}">2026-01-31</strong></div>
    </div>

    <table>
        <thead>
        <tr><th>Date</th><th>Member</th><th>Savings Product</th><th class="money">Amount</th><th>Field Officer 1</th><th>Field Officer 2</th><th>Posted By</th></tr>
        </thead>
        <tbody>
        <tr th:each="f : ${entries}">
            <td th:text="${f.savingsTransaction.transactionDate}">-</td>
            <td th:text="${f.client.fullName}">-</td>
            <td th:text="${f.savingsTransaction.savingsAccount.savingsProduct.name}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(f.savingsTransaction.amount,1,'COMMA',2,'POINT')} + (${f.savingsTransaction.voided} ? ' (VOIDED)' : '')">0.00</td>
            <td th:text="${f.collectorOneName}">-</td>
            <td th:text="${f.collectorTwoName}">-</td>
            <td th:text="${f.createdBy}">-</td>
        </tr>
        <tr th:if="${#lists.isEmpty(entries)}"><td colspan="7">No field collections in this period.</td></tr>
        </tbody>
    </table>

    <div class="summary-box">
        Total Collected: <span th:text="${#numbers.formatDecimal(totalAmount,1,'COMMA',2,'POINT')}">0.00</span>
    </div>

    <div class="footer-note">
        Generated <span th:text="${generatedAt}">-</span> by <span th:text="${generatedBy}">-</span>
    </div>
</body>
</html>
