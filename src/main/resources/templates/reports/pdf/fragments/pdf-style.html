<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="style">
    <style>
        @page {
            size: A4;
            margin: 2.4cm 1.8cm 2.6cm 1.8cm;
            @bottom-center {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 8px;
                color: #9ca3af;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10.5px;
            color: #1f2937;
        }

        .letterhead {
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 3px solid #4f46e5;
        }

        .letterhead .brand-mark {
            display: inline-block;
            width: 34px;
            height: 34px;
            line-height: 34px;
            border-radius: 8px;
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            margin-bottom: 6px;
        }

        .letterhead .club-name {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
            margin: 2px 0 0;
        }

        .letterhead .report-title {
            font-size: 12.5px;
            font-weight: 700;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 4px 0 2px;
        }

        .letterhead .meta {
            font-size: 10px;
            color: #6b7280;
            margin-top: 2px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 20px 0 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        th {
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 7px 8px;
            text-align: left;
        }

        td {
            padding: 6px 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        td.money, th.money {
            text-align: right;
        }

        tfoot td, .opening-row td {
            font-weight: bold;
            background-color: #eef2ff;
            border-top: 2px solid #4f46e5;
        }

        .status-ok, .status-bad {
            text-align: center;
            margin-top: 18px;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-ok {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-bad {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .summary-box {
            margin-top: 20px;
            padding: 10px 14px;
            background-color: #eef2ff;
            border-left: 4px solid #4f46e5;
            font-size: 13px;
            font-weight: 700;
            color: #312e81;
            text-align: center;
        }

        .footer-note {
            margin-top: 28px;
            font-size: 8.5px;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid #e5e7eb;
            padding-top: 8px;
        }
    </style>
</th:block>
</body>
</html>
