<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Savings Report</title>
    <th:block th:replace="~{reports/pdf/fragments/pdf-style :: style}"></th:block>
</head>
<body>
    <div class="letterhead">
        <div class="brand-mark">DIC</div>
        <div class="club-name">Destiny Investment Club</div>
        <div class="report-title">Savings Report</div>
        <div class="meta" th:text="${selectedStatus} != null ? ('Status: ' + ${selectedStatus}) : 'All savings accounts'">All savings accounts</div>
    </div>

    <table>
        <thead>
        <tr><th>Account #</th><th>Owner</th><th>Product</th><th>Opened</th><th>Status</th><th class="money">Balance</th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${accounts}">
            <td th:text="${a.accountNumber}">SB000001</td>
            <td th:text="${a.ownerName}">-</td>
            <td th:text="${a.savingsProduct.name}">-</td>
            <td th:text="${a.openedDate}">-</td>
            <td th:text="${a.status}">-</td>
            <td class="money" th:text="${#numbers.formatDecimal(a.balance,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(accounts)}"><td colspan="6">No savings accounts found.</td></tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="5">Total Balance</td>
            <td class="money" th:text="${#numbers.formatDecimal(totalBalance,1,'COMMA',2,'POINT')}">0.00</td>
        </tr>
        </tfoot>
    </table>

    <div class="footer-note">
        Generated <span th:text="${generatedAt}">-</span> by <span th:text="${generatedBy}">-</span>
    </div>
</body>
</html>
