<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Income and Expenditure')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Income &amp; Expenditure Statement', subtitle=${fromDate} + ' to ' + ${toDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/income-statement}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank"
           th:href="@{/reports/income-statement/pdf(fromDate=${fromDate},toDate=${toDate})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Income</h5>
                <table class="table table-sm">
                    <tbody>
                    <tr th:each="i : ${report.income}">
                        <td th:text="${i.code} + ' - ' + ${i.name}">-</td>
                        <td class="money" th:text="${#numbers.formatDecimal(i.amount,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(report.income)}"><td colspan="2" class="text-muted">No income for this period.</td></tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold"><td>Total Income</td><td class="money" th:text="${#numbers.formatDecimal(report.totalIncome,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    </tfoot>
                </table>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3">
                <h5>Expenditure</h5>
                <table class="table table-sm">
                    <tbody>
                    <tr th:each="e : ${report.expenses}">
                        <td th:text="${e.code} + ' - ' + ${e.name}">-</td>
                        <td class="money" th:text="${#numbers.formatDecimal(e.amount,1,'COMMA',2,'POINT')}">0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(report.expenses)}"><td colspan="2" class="text-muted">No expenditure for this period.</td></tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold"><td>Total Expenditure</td><td class="money" th:text="${#numbers.formatDecimal(report.totalExpenses,1,'COMMA',2,'POINT')}">0.00</td></tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <div class="card p-3 mt-3">
        <h5>Net Surplus / (Deficit) for the Period:
            <span th:text="${#numbers.formatDecimal(report.netSurplus,1,'COMMA',2,'POINT')}">0.00</span>
        </h5>
    </div>
</main>
</body>
</html>
