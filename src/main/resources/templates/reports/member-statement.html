<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Member Statement')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Member Statement', subtitle=${report != null} ? (${report.client.fullName} + ' (' + ${report.client.clientNumber} + ')') : null)}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/member-statement}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">Member</label>
                <select class="form-select" name="clientId" required style="min-width: 260px;">
                    <option value="">-- select member --</option>
                    <option th:each="c : ${clients}" th:value="${c.id}"
                            th:selected="${selectedClientId != null and selectedClientId == c.id}"
                            th:text="${c.fullName} + ' (' + ${c.clientNumber} + ')'"></option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank" th:if="${report != null}"
           th:href="@{/reports/member-statement/pdf(clientId=${selectedClientId},fromDate=${fromDate},toDate=${toDate})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div th:if="${report != null}">
        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-muted small">Opening Savings Balance</div>
                    <div class="fs-5" th:text="${#numbers.formatDecimal(report.openingSavingsBalance,1,'COMMA',2,'POINT')}">0.00</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-muted small">Closing Savings Balance</div>
                    <div class="fs-5" th:text="${#numbers.formatDecimal(report.closingSavingsBalance,1,'COMMA',2,'POINT')}">0.00</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-muted small">Opening Loan Balance</div>
                    <div class="fs-5" th:text="${#numbers.formatDecimal(report.openingLoanBalance,1,'COMMA',2,'POINT')}">0.00</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3">
                    <div class="text-muted small">Closing Loan Balance</div>
                    <div class="fs-5" th:text="${#numbers.formatDecimal(report.closingLoanBalance,1,'COMMA',2,'POINT')}">0.00</div>
                </div>
            </div>
        </div>

        <div class="card p-3">
            <table class="table table-sm table-report">
                <thead>
                <tr>
                    <th>Date</th><th>Description</th><th>Reference</th><th>Account</th>
                    <th class="money">Savings</th><th class="money">Savings Balance</th>
                    <th class="money">Loan</th><th class="money">Loan Balance</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${report.rows}">
                    <td th:text="${r.date}">-</td>
                    <td th:text="${r.description}">-</td>
                    <td th:text="${r.reference}">-</td>
                    <td th:text="${r.accountNumber}">-</td>
                    <td class="money" th:text="${r.savingsAmount != null} ? ${#numbers.formatDecimal(r.savingsAmount,1,'COMMA',2,'POINT')} : ''"></td>
                    <td class="money" th:text="${#numbers.formatDecimal(r.savingsBalance,1,'COMMA',2,'POINT')}">0.00</td>
                    <td class="money" th:text="${r.loanAmount != null} ? ${#numbers.formatDecimal(r.loanAmount,1,'COMMA',2,'POINT')} : ''"></td>
                    <td class="money" th:text="${#numbers.formatDecimal(r.loanBalance,1,'COMMA',2,'POINT')}">0.00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(report.rows)}"><td colspan="8" class="text-muted">No savings or loan movement in this period.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
