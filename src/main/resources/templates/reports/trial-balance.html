<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Trial Balance')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Trial Balance', subtitle='As of ' + ${asOfDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/trial-balance}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">As of Date</label>
                <input type="date" class="form-control" name="asOfDate" th:value="${asOfDate}"/>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank"
           th:href="@{/reports/trial-balance/pdf(asOfDate=${asOfDate})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div class="card p-3">
        <table class="table table-report">
            <thead><tr><th>Code</th><th>Account</th><th>Type</th><th class="money">Debit</th><th class="money">Credit</th></tr></thead>
            <tbody>
            <tr th:each="l : ${report.lines}">
                <td th:text="${l.code}">1000</td>
                <td th:text="${l.name}">Cash</td>
                <td th:text="${l.accountType}">ASSET</td>
                <td class="money" th:text="${l.debit.signum() != 0} ? ${#numbers.formatDecimal(l.debit,1,'COMMA',2,'POINT')} : ''"></td>
                <td class="money" th:text="${l.credit.signum() != 0} ? ${#numbers.formatDecimal(l.credit,1,'COMMA',2,'POINT')} : ''"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(report.lines)}"><td colspan="5" class="text-muted">No postings yet.</td></tr>
            </tbody>
            <tfoot>
            <tr class="fw-bold">
                <td colspan="3">Total</td>
                <td class="money" th:text="${#numbers.formatDecimal(report.totalDebit,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(report.totalCredit,1,'COMMA',2,'POINT')}">0.00</td>
            </tr>
            </tfoot>
        </table>
        <div th:class="${report.balanced} ? 'alert alert-success' : 'alert alert-danger'"
             th:text="${report.balanced} ? 'Trial balance is balanced.' : 'Trial balance is NOT balanced - please investigate.'"></div>
    </div>
</main>
</body>
</html>
