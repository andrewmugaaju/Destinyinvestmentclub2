<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Loans Report')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Loans Report', subtitle=${fromDate} + ' to ' + ${toDate})}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/loans}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">From</label>
                <input type="date" class="form-control" name="fromDate" th:value="${fromDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">To</label>
                <input type="date" class="form-control" name="toDate" th:value="${toDate}"/>
            </div>
            <div class="col-auto">
                <label class="form-label">Type</label>
                <select class="form-select" name="type">
                    <option value="">-- All --</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${selectedType == t}"></option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank"
           th:href="@{/reports/loans/pdf(fromDate=${fromDate},toDate=${toDate},type=${selectedType})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <div class="card p-3">
                <div class="text-muted small">Total Disbursed</div>
                <div class="fs-5" th:text="${#numbers.formatDecimal(totalDisbursed,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-3">
                <div class="text-muted small">Total Repaid</div>
                <div class="fs-5" th:text="${#numbers.formatDecimal(totalRepaid,1,'COMMA',2,'POINT')}">0.00</div>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <table class="table table-sm table-report">
            <thead>
            <tr><th>Date</th><th>Loan #</th><th>Borrower</th><th>Product</th><th>Type</th><th class="money">Amount</th><th class="money">Principal</th><th class="money">Interest</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.transactionDate}">-</td>
                <td><a th:href="@{/loan-accounts/{id}(id=${t.loanAccount.id})}" th:text="${t.loanAccount.loanAccountNumber}">LN000001</a></td>
                <td th:text="${t.loanAccount.borrowerName}">-</td>
                <td th:text="${t.loanAccount.loanProduct.name}">-</td>
                <td><span class="badge" th:classappend="${t.transactionType.name() == 'DISBURSEMENT'} ? 'bg-primary' : 'bg-success'" th:text="${t.transactionType}">-</span></td>
                <td class="money" th:text="${#numbers.formatDecimal(t.amount,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(t.principalPortion,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(t.interestPortion,1,'COMMA',2,'POINT')}">0.00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="8" class="text-muted">No loan transactions in this period.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
