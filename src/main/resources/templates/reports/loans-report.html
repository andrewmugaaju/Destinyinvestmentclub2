<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Loans Report')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/report-header :: header(title='Loans Report', subtitle=${selectedStatus} != null ? ('Status: ' + ${selectedStatus}) : 'All loans')}"></div>

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
        <form method="get" th:action="@{/reports/loans}" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="">-- All statuses --</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Run</button>
            </div>
        </form>
        <a class="btn btn-outline-secondary" target="_blank"
           th:href="@{/reports/loans/pdf(status=${selectedStatus})}">
            <i class="bi bi-file-earmark-pdf"></i> Export to PDF
        </a>
    </div>

    <div class="card p-3">
        <table class="table table-sm table-report">
            <thead>
            <tr>
                <th>Loan #</th><th>Borrower</th><th>Product</th><th class="money">Principal</th>
                <th class="money">Rate</th><th>Term</th><th>Status</th><th>Disbursed</th>
                <th class="money">Outstanding Principal</th><th class="money">Outstanding Interest</th><th class="money">Total Outstanding</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${loans}">
                <td><a th:href="@{/loan-accounts/{id}(id=${l.id})}" th:text="${l.loanAccountNumber}">LN000001</a></td>
                <td th:text="${l.borrowerName}">-</td>
                <td th:text="${l.loanProduct.name}">-</td>
                <td class="money" th:text="${#numbers.formatDecimal(l.principalAmount,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${l.annualInterestRate} + '%'">0%</td>
                <td th:text="${l.termMonths} + ' mo'">-</td>
                <td><span class="badge bg-secondary" th:text="${l.status}">-</span></td>
                <td th:text="${l.disbursementDate}">-</td>
                <td class="money" th:text="${#numbers.formatDecimal(l.outstandingPrincipal,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(l.outstandingInterest,1,'COMMA',2,'POINT')}">0.00</td>
                <td class="money" th:text="${#numbers.formatDecimal(l.totalOutstanding,1,'COMMA',2,'POINT')}">0.00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(loans)}"><td colspan="11" class="text-muted">No loans found.</td></tr>
            </tbody>
            <tfoot>
            <tr class="fw-bold">
                <td colspan="10">Total Outstanding</td>
                <td class="money" th:text="${#numbers.formatDecimal(totalOutstanding,1,'COMMA',2,'POINT')}">0.00</td>
            </tr>
            </tfoot>
        </table>
    </div>
</main>
</body>
</html>
