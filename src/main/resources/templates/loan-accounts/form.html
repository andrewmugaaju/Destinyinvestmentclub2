<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Loan Application')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container" style="max-width: 640px;">
    <h2>New Loan Application</h2>
    <div class="card p-4">
        <form th:action="@{/loan-accounts}" method="post">
            <div class="mb-3">
                <label class="form-label">Client (individual loan)</label>
                <select class="form-select" name="clientId">
                    <option value="">-- none --</option>
                    <option th:each="c : ${clients}" th:value="${c.id}" th:selected="${selectedClientId != null and selectedClientId == c.id}" th:text="${c.fullName} + ' (' + ${c.clientNumber} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Or Group (group loan)</label>
                <select class="form-select" name="groupId">
                    <option value="">-- none --</option>
                    <option th:each="g : ${groups}" th:value="${g.id}" th:selected="${selectedGroupId != null and selectedGroupId == g.id}" th:text="${g.groupName}"></option>
                </select>
                <div class="form-text">Choose either a client or a group, not both.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Principal Amount</label>
                <input type="number" step="0.01" name="principalAmount" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" step="0.001" min="0" name="annualInterestRate" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Term (months)</label>
                <input type="number" min="1" name="termMonths" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Application Fee</label>
                <input type="number" step="0.01" min="0" name="applicationFeeAmount" class="form-control" value="0"/>
                <div class="form-text">Non-refundable, charged when the loan is disbursed. Leave as 0 if none.</div>
            </div>
            <button type="submit" class="btn btn-primary">Submit Application</button>
            <a href="/loan-accounts" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
