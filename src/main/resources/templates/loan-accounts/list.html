<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Loan Accounts')}"></head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Loan Accounts</h2>
        <a class="btn btn-primary" href="/loan-accounts/new">+ New Loan Application</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover">
            <thead><tr><th>Loan #</th><th>Borrower</th><th>Product</th><th class="money">Principal</th><th>Status</th><th class="money">Outstanding</th><th></th></tr></thead>
            <tbody>
            <tr th:each="l : ${loans}">
                <td th:text="${l.loanAccountNumber}">LN000001</td>
                <td th:text="${l.borrowerName}">-</td>
                <td th:text="${l.loanProduct.name}">-</td>
                <td class="money" th:text="${#numbers.formatDecimal(l.principalAmount,1,'COMMA',2,'POINT')}">0.00</td>
                <td><span class="badge bg-secondary" th:text="${l.status}">PENDING</span></td>
                <td class="money" th:text="${#numbers.formatDecimal(l.totalOutstanding,1,'COMMA',2,'POINT')}">0.00</td>
                <td><a class="btn btn-sm btn-outline-primary" th:href="@{/loan-accounts/{id}(id=${l.id})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(loans)}"><td colspan="7" class="text-muted">No loans yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
